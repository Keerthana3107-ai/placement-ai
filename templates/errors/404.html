{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="card-modern p-5 border-0 shadow">
            <i class="bi bi-compass text-primary" style="font-size: 4rem;"></i>
            <h2 class="fw-bold mt-3">404 - Page Not Found</h2>
            <p class="text-muted">The placement drive, candidate profile, or page you were looking for doesn't exist or has moved.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-semibold mt-2">
                <i class="bi bi-house-door me-1"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
