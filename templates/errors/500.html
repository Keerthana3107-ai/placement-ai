{% extends 'base.html' %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <div class="card-modern p-5 border-0 shadow">
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
            <h2 class="fw-bold mt-3">500 - Server Error</h2>
            <p class="text-muted">An unexpected error occurred while processing your request. Please try again or notify the campus IT team.</p>
            <a href="{{ url_for('index') }}" class="btn btn-primary px-4 fw-semibold mt-2">
                <i class="bi bi-house-door me-1"></i> Return to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
