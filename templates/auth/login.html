{% extends 'base.html' %}

{% block title %}Sign In - AI Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card-modern p-4 p-md-5 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="bi bi-person-lock fs-2"></i>
                </div>
                <h3 class="fw-bold">Sign In to Your Account</h3>
                <p class="text-muted small">Access your personalized placement dashboard</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username or Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="identifier" class="form-control" placeholder="e.g. student@example.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="border-top pt-4 mt-2">
                <div class="small fw-semibold text-muted text-uppercase mb-2 text-center" style="font-size: 0.72rem;">
                    Instant 1-Click Demo Login
                </div>
                <div class="d-flex flex-column gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary d-flex align-items-center justify-content-between" onclick="fillAndSubmit('student@example.com', 'password123')">
                        <span><i class="bi bi-mortarboard-fill me-2"></i> Student: Alex Morgan (CS, 8.8 CGPA)</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-dark d-flex align-items-center justify-content-between" onclick="fillAndSubmit('admin@example.com', 'admin123')">
                        <span><i class="bi bi-shield-lock-fill me-2"></i> Placement Officer / Admin</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success d-flex align-items-center justify-content-between" onclick="fillAndSubmit('recruiter@google.com', 'password123')">
                        <span><i class="bi bi-building-fill me-2"></i> Company Recruiter (Google)</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </div>

            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">Don't have an account yet?</span>
                <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold small ms-1">Create Account</a>
            </div>
        </div>
    </div>
</div>

<script>
function fillAndSubmit(user, pass) {
    document.querySelector('input[name="identifier"]').value = user;
    document.querySelector('input[name="password"]').value = pass;
    document.querySelector('form').submit();
}
</script>
{% endblock %}
