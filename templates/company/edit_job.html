{% extends 'base.html' %}

{% block title %}Edit Job Drive - {{ job.title }}{% endblock %}
{% block page_heading %}Update Campus Job Drive{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="mb-3">
        <a href="{{ url_for('company.dashboard') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card-modern p-4 p-md-5">
                <h4 class="fw-bold mb-4 pb-2 border-bottom">Edit Job: {{ job.title }}</h4>

                <form method="POST" action="{{ url_for('company.edit_job', job_id=job.id) }}">
                    <div class="row g-3 mb-3">
                        <div class="col-md-7">
                            <label class="form-label small fw-semibold">Job Title</label>
                            <input type="text" name="title" class="form-control" value="{{ job.title }}" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-semibold">Location</label>
                            <input type="text" name="location" class="form-control" value="{{ job.location }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Required Skills (Comma-separated)</label>
                        <input type="text" name="required_skills" class="form-control" value="{{ job.required_skills }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Min CGPA</label>
                            <input type="number" step="0.01" min="0" max="10" name="min_cgpa" class="form-control" value="{{ job.min_cgpa }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Package (Display Text)</label>
                            <input type="text" name="salary_package" class="form-control" value="{{ job.salary_package }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-semibold">Numeric CTC (LPA)</label>
                            <input type="number" step="0.1" name="salary_numeric" class="form-control" value="{{ job.salary_numeric }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold">Eligible Departments</label>
                            <input type="text" name="eligible_departments" class="form-control" value="{{ job.eligible_departments }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Graduation Year</label>
                            <input type="number" name="graduation_year" class="form-control" value="{{ job.graduation_year }}" required>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-semibold">Openings</label>
                            <input type="number" name="openings" class="form-control" value="{{ job.openings }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Application Deadline</label>
                        <input type="date" name="deadline" class="form-control" value="{{ job.deadline }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Description</label>
                        <textarea name="description" rows="5" class="form-control" required>{{ job.description }}</textarea>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" name="is_active" id="activeCheck" {% if job.is_active %}checked{% endif %}>
                        <label class="form-check-label small fw-semibold" for="activeCheck">
                            Job Drive Active (Accepting Student Applications)
                        </label>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('company.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4 fw-semibold">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
